name: Build Release APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign Release APK
        run: |
          # Locate built APK
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"

          # Generate a temporary signing key on the runner
          keytool -genkey -v -keystore temp.keystore -alias tempKey -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Release, OU=App, O=App, L=City, S=State, C=US"

          # Sign using Android build-tools apksigner
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools/ -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner sign --ks temp.keystore --ks-pass pass:password --key-pass pass:password --out app-release.apk "$APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
